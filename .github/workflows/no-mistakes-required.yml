name: Require no-mistakes
run-name: "PR #${{ github.event.pull_request.number }} body compliance - ${{ github.event.action }} - event ${{ github.run_number }} (run ${{ github.run_id }})"

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
    branches:
      - main

permissions:
  contents: read

# GitHub concurrency groups retain at most one pending run, replacing older
# pending runs even when cancel-in-progress is false. Give body-bearing events
# an immutable per-event group so first-time-fork approvals can never collapse
# opened/edited checks. Keep synchronize/reopened coalescing as before.
concurrency:
  group: no-mistakes-required-${{ github.event.pull_request.number }}-${{ (github.event.action == 'opened' || github.event.action == 'edited') && github.run_id || 'head-change' }}
  cancel-in-progress: true

jobs:
  check:
    name: PR must be raised via no-mistakes
    runs-on: ubuntu-latest
    if: >-
      github.event.pull_request.user.login != 'github-actions[bot]' &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    steps:
      - name: Verify no-mistakes signature in PR body
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -eu
          marker='Updates from [git push no-mistakes](https://github.com/kunchenguid/no-mistakes)'
          if printf '%s' "${PR_BODY:-}" | grep -qF -- "$marker"; then
            echo "Found no-mistakes signature in PR #${PR_NUMBER} body."
            if ! command -v jq >/dev/null 2>&1; then
              echo "::error::This check requires jq to parse no-mistakes pipeline step attestation, but jq was not found on the runner." >&2
              exit 1
            fi
            prefix='<!-- no-mistakes-pipeline-attestation:v1 '
            suffix=' -->'
            body="${PR_BODY:-}"
            json=''
            attest_present=0
            parse_ok=0
            case "$body" in
              *"$prefix"*)
                attest_present=1
                rest="${body#*"$prefix"}"
                case "$rest" in
                  *"$suffix"*)
                    json="${rest%%"$suffix"*}"
                    if printf '%s' "$json" | jq -e . >/dev/null 2>&1; then
                      parse_ok=1
                    fi
                    ;;
                esac
                ;;
            esac
            if [ "$attest_present" -eq 1 ] && [ "$parse_ok" -ne 1 ]; then
              {
                echo "::error::The no-mistakes pipeline step attestation comment is present but unparseable."
                echo
                echo "The PR body contains the attestation prefix but not a valid"
                echo "'<!-- no-mistakes-pipeline-attestation:v1 {...} -->' comment."
                echo "A corrupt attestation is never accepted; re-run the pipeline with"
                echo "'git push no-mistakes' so it is rewritten."
                echo "See CONTRIBUTING.md for setup and the full workflow."
                echo
                echo "PR author: ${PR_AUTHOR}"
              } >&2
              exit 1
            fi
            if [ "$attest_present" -ne 1 ]; then
              # Structured attestation is only emitted by no-mistakes >= 1.46.0
              # (https://github.com/kunchenguid/no-mistakes/pull/670), but this
              # repository supports the older releases CONTRIBUTING.md pins
              # (v1.31.2+). Those still write a deterministic '## Pipeline'
              # section with one status summary per step, so hold the same
              # line there: Review, Test, and Document must each be present
              # and not skipped. Signature-only bodies that hide those steps
              # still fail.
              for required in Review Test Document; do
                step_line=$(printf '%s\n' "$body" | grep -E "<summary>.*\*\*${required}\*\*" | head -n 1)
                if [ -z "$step_line" ]; then
                  {
                    echo "::error::Required no-mistakes pipeline step '${required}' is missing from the PR body."
                    echo
                    echo "No structured step attestation comment was found (emitted by"
                    echo "no-mistakes >= 1.46.0), and the legacy '## Pipeline' section does"
                    echo "not record a '${required}' step summary either. A signature line"
                    echo "alone can hide skipped review, test, or document steps."
                    echo
                    echo "Re-run the pipeline with 'git push no-mistakes' (no-mistakes"
                    echo "v1.31.2+ per CONTRIBUTING.md) so every required step runs and is"
                    echo "recorded in the PR body."
                    echo
                    echo "PR author: ${PR_AUTHOR}"
                  } >&2
                  exit 1
                fi
                case "$step_line" in
                  *[Ss]kip*)
                    {
                      echo "::error::Required no-mistakes pipeline step '${required}' was skipped: ${step_line}"
                      echo
                      echo "This repository requires review, test, and document to each run to"
                      echo "completion. Quota skips and agent skips are not compliant."
                      echo
                      echo "Re-run the pipeline with 'git push no-mistakes' so those required"
                      echo "steps complete rather than skip."
                      echo "See CONTRIBUTING.md for setup and the full workflow."
                      echo
                      echo "PR author: ${PR_AUTHOR}"
                    } >&2
                    exit 1
                    ;;
                esac
              done
              echo "No structured attestation comment (pre-1.46.0 no-mistakes); legacy pipeline step summaries are valid: Review, Test, and Document are present and not skipped."
              exit 0
            fi
            incomplete=''
            for required in review test document; do
              status=$(printf '%s' "$json" | jq -r --arg step "$required" \
                '([(.steps | arrays | .[]) | select(.step == $step) | .status] | first // empty | select(. != "")) // "missing"')
              if [ "$status" != "completed" ]; then
                if [ -n "$incomplete" ]; then
                  incomplete="${incomplete}, "
                fi
                incomplete="${incomplete}${required}=${status}"
              fi
            done
            if [ -n "$incomplete" ]; then
              {
                echo "::error::Required no-mistakes pipeline steps are not completed: ${incomplete}."
                echo
                echo "This repository requires review, test, and document to each have status"
                echo "exactly 'completed'. Quota skips and agent skips are not compliant."
                echo
                echo "Re-run the pipeline with 'git push no-mistakes' using no-mistakes >= 1.46.0"
                echo "so those required steps complete rather than skip."
                echo "See CONTRIBUTING.md for setup and the full workflow."
                echo
                echo "PR author: ${PR_AUTHOR}"
              } >&2
              exit 1
            fi
            echo "Pipeline step attestation is valid: review, test, and document are completed."
            exit 0
          fi
          {
            echo "::error::This PR was not raised through no-mistakes."
            echo
            echo "Contributions to this repository must be submitted via 'git push no-mistakes'."
            echo "That pipeline runs the required review/test/lint/CI steps and writes a"
            echo "deterministic '## Pipeline' section into the PR body containing:"
            echo
            echo "    $marker"
            echo
            echo "See CONTRIBUTING.md for setup and the full workflow."
            echo
            echo "PR author: ${PR_AUTHOR}"
          } >&2
          exit 1
